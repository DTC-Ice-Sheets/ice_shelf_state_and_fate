# A reuseable generic pipeline for testing a DTC Ice Sheets Python package
name: generic_test

on:
  workflow_call:
    inputs:
      package_name:
        description: "The name of the package to build."
        required: true
        type: string
      notebooks_allowed:
        description: "Whether or not Jupyter notebooks are permitted in the package."
        default: false
        required: false
        type: boolean
      home_directories_allowed:
        description: "Whether or not hardcoded home directories are permitted in the package."
        default: false
        required: false
        type: boolean
      file_size_limit_mb:
        description: "The CI chain will fail if there are any files present larger than this size in MB."
        default: 5
        required: false
        type: number

jobs:
  lint_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Load cached venv
        id: load-cached-poetry-venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-3.12-${{ hashFiles('**/poetry.lock') }}

      - name: Configure git authentication
        run: |
          git config --global url."https://${{ secrets.GH_ADMIN_PAT }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        if: steps.load-cached-poetry-venv.outputs.cache-hit != 'true'
        run: poetry install --with dev --no-root

      - name: Install package
        run: poetry install --with dev

      # - name: Enforce no jupyter notebooks allowed
      #   if: ${{ ! inputs.notebooks_allowed }}
      #   run: |
      #     [[ ! $(find . -type f -name *.ipynb | grep .) ]]

      # - name: Enforce max noqa statement count
      #   # an additional check against those trying to dodge the linter
      #   run: |
      #     test $(grep -r --exclude-dir=.venv . -e "noqa:" | wc -l) -le 100

      # - name: Enforce no hard-coded home directories
      #   if: ${{ ! inputs.home_directories_allowed }}
      #   run: |
      #     [[ ! $(grep -r -e "/home/" --exclude-dir=.venv --include=\*.py --include=\*.ipynb .) ]]

      # - name: Enforce no large files
      #   run: |
      #     [[ $(find . -printf '%s %p\n'| grep -v .git | grep -v .venv | sort -nr | head -1 | awk '{print $1}') -le ${{ inputs.file_size_limit_mb }}*1024*1024 ]]

      # - name: Check linting
      #   run: |
      #     poetry run ruff check --config pyproject.toml

      - name: Check docstrings
        run: |
          poetry run pydoclint --config pyproject.toml --quiet src/

      # - name: Check for security issues
      #   run: |
      #     poetry run bandit -r src --severity-level medium --confidence-level medium --quiet

      - name: Run unit tests
        run: |
          poetry run pytest

      - name: Check package can be built
        run: |
          poetry build

  build_and_push_production_container:
    runs-on: ubuntu-latest
    container:
      image: docker:27.4
    defaults:
      run:
        shell: sh -l {0}
    steps:
      - name: Login to OVH Registry
        uses: docker/login-action@v3
        with:
          registry: 7sy3luly.c1.de1.container-registry.ovh.net
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Define container name
        id: name_container
        run: |
          echo "image_name=7sy3luly.c1.de1.container-registry.ovh.net/dtc-ice-sheets/${{ inputs.package_name }}_production" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v3
        with:
          fetch-depth: '2'

      - name: Configure runtime environment variable secrets
        run: |
          cat <<EOT > .env
          SPECKLIA_TOKEN="${{ secrets.SPECKLIA_TOKEN }}"
          EDH_TOKEN="${{ secrets.EDH_TOKEN }}"
          EODS_USERNAME="${{ secrets.EODS_USERNAME }}"
          EODS_PASSWORD="${{ secrets.EODS_PASSWORD }}"
          AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}"
          AWS_S3_ENDPOINT="${{ secrets.AWS_S3_ENDPOINT }}"
          EOT

          echo "${{ secrets.GH_ADMIN_PAT }}" > .gh_token.txt

      - name: Build and push this package's production image
      # We use Docker BuildKit to ensure the GitHub token remains a secret and is not shown in plaintext in build logs
        run: |
          DOCKER_BUILDKIT=1 docker build \
            --cache-from ${{ steps.name_container.outputs.image_name }} \
            --secret id=github_token,src=.gh_token.txt \
            --tag ${{ steps.name_container.outputs.image_name }} -f Dockerfile .
          docker push "${{ steps.name_container.outputs.image_name }}"

      - name: Clean up secrets
        run: |
          rm -f .gh_token.txt
          rm -f .env
