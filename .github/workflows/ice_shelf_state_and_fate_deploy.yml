# When a version tag is pushed, deploy using that tag.
# When adapting this template for your own use, please rename "ice_shelf_state_and_fate" to your package name.
name: ice_shelf_state_and_fate_deploy

on:
  push:
    branches:
      - main # only on main (and implicitly not tags)
  workflow_dispatch:  # allow manual triggering of the workflow

jobs:
  deploy:
    if: github.actor != 'ew-version-bumper[bot]'
    uses: ./.github/workflows/generic_deploy.yml
    with:
      package_name: ice_shelf_state_and_fate
    secrets: inherit
