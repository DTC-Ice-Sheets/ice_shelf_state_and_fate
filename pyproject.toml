[build-system]
requires = ["poetry>=1.5"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "use_case_3"
version = "0.0.23"
description = "DTC-IS State and fate of Antarctic Ice Shelves demonstrator will enable the stakeholders to gain information on the State and fate of Antarctic Ice Shelves"
authors = ["Earthwave Ltd <info@earthwave.co.uk>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/dtc-ice-sheets/use_case_3"
packages = [{ include = "use_case_3", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
numpy = "^2.2"
pandas = "^2.3.3"
matplotlib = "^3.10.8"
affine = "^2.4.0"
rasterio = "^1.4.4"
xarray = "^2025.12.0"
scipy = "^1.16.3"
geopandas = "^1.1.2"
zarr = "^3.1.5"
scikit-learn = "^1.8.0"
scikit-gstat = "^1.0.22"
seaborn = "^0.13.2"
fiona = "^1.10.1"
tqdm = "^4.67.1"
netcdf4 = "^1.7.3"
rioxarray = "^0.19.0"
contextily = "^1.7.0"
statsmodels = "^0.14.6"
folium = "^0.20.0"
schema = "^0.7.8"
aiohttp = "^3.13.2"
pystac-client = "^0.9.0"
specklia = "^1.9.110"
dotenv = "^0.9.9"
cyclopts = "^4.4.3"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
typeguard = "^4.4.4"
pre-commit = "^4.5"
ruff = "^0.14.10"
bandit = "^1.9.2"
pytest-cov = "^7.0.0"
sphinx = "^9.1.0"
sphinx-rtd-theme = "^3.0.2"
sphinx-copybutton = "^0.5.2"
commitizen = "^4.11.0"
pydoclint = "^0.6.10"

[tool.poetry.group.dashboard.dependencies]
plotly = "^6.5.0"
dash = { extras = ["async", "diskcache"], version = "^3.3.0" }
dash-auth = "^2.3.0"
dash-bootstrap-components = "^2.0.4"
data-download-module = { git = "https://github.com/DTC-Ice-Sheets/data_download_module.git", branch = "use-case-3-dashboard-local-datasets" }
dtc-query-client = { git = "https://github.com/DTC-Ice-Sheets/dtc_query_api.git", subdirectory = "dtc_query_client", tag = "0.0.40" }
gunicorn = "^23.0.0"
ipywidgets = "^8.1.8"
jupyter = "^1.1.1"
ruptures = "^1.1.10"
s3fs = "^2025.12.0"
num2words = "^0.5.14"
diskcache = "^5.6.3"
asyncstdlib = "^3.13.1"

[tool.poetry.group.deployment.dependencies]
dtc-wrapper = { git = "https://github.com/DTC-Ice-Sheets/dtc_wrapper.git", tag = "0.0.34" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "T20", # Disallow print statements
    "A",   # Ambiguity
    "ANN", # Annotations
    "B",   # Bad practices
    "C90", # Complexity
    "D",   # Documentation
    "E",   # Errors
    "F",   # Pyflakes (e.g. unused imports and vars)
    "G",   # logging formatting
    "I",   # Imports
    "N",   # Naming
    "Q",   # Quoting
    "W",   # Warnings
    "PT",  # pytest-style
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ARG", # flake8-unused-arguments
    "PIE", # flake8-pie
    "RUF", # Ruff-specific rules
    "BLE", # Blind except
    "RET", # Return statements
    "PTH", # Use pathlib
    "PD",  # Pandas
]

[tool.pydoclint]
style = 'numpy'
check_style_mismatch = "true"

mccabe = { max-complexity = 10 }

ignore = [
    "D203", # One blank line required before class docstring (conflicts with D211)
    "D204", # One blank line required after class docstring
    "D205", # Docstring with no content
    "D212", # Multi-line docstring summary should start at the second line
    "D213", # Multi-line docstring summary should start at the first line
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "T201", # Allow print statements in test files, as they are commonly used for debugging
    "E402", # Allow 'import' statements not being at the top of the file (common in test files for clarity)
    "S101", # Allow the use of 'assert' statements in test files (common practice in pytest)
    "D103", # Ignore missing docstring warnings for functions in test files (commonly not required for small test functions)
    "ANN",  # Ignore missing type annotations for functions in test files (commonly not required for small test functions)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy" # Accepts: "google", "numpy", or "pep257"
[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']

[tool.pytest.ini_options]
addopts = "--disable-warnings --cov use_case_3 --cov-fail-under=80 --show-capture=stderr"
typeguard-packages = """use_case_3"""
typeguard-debug-instrumentation = true
typeguard-forward-ref-policy = "ERROR"
typeguard-collection-check-strategy = "ALL_ITEMS"
