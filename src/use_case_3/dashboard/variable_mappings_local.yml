polarice_elevation_change:
  description: "POCA corrected gridded swath elevation data"
  label: "Polarice elevation product:"
  region: "ice_shelf"
  variables:
    height_difference_from_reference_elevation:
      units: "m"
      timeseries_type: "derivative"
      measurement_uncertainties: "height_difference_from_reference_elevation_uncertainty"
      measurement_uncertainty_type: null
      label: "Elevation difference"
      y_axis_label: ""

sub_glacial_lakes:
  description: "The 4D Antarctica Subglacial Lakes dataset."
  label: "4D Antarctica Subglacial Lakes:"
  region: "ice_shelf"
  variables:
    height_above_wgs84_ellipsoid:
      units: "m"
      timeseries_type: "derivative"
      measurement_uncertainties: "height_above_wgs84_ellipsoid_uncertainties"
      measurement_uncertainty_type: "std"
      label: "Elevation"
      y_axis_label: ""
    rate_of_volume_change:
