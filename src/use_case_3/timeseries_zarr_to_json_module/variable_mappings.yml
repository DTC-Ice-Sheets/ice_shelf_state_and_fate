      label: "Elevation"
      y_axis_label: ""
    rate_of_volume_change:
      units: "m3 yr-1"
      timeseries_type: "derivative"
      measurement_uncertainties: null
      measurement_uncertainty_type: null
      label: "Rate of Volume Change"
      y_axis_label: ""
