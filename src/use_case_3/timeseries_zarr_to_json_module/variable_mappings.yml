4D_ANTARCTICA_SUBGLACIAL_LAKES:
  description: "The 4D Antarctica Subglacial Lakes dataset."
  label: "4D Antarctica Subglacial Lakes"
  region: "ice_shelf"
  variables:
    height_above_wgs84_ellipsoid:
      units: "m"
      timeseries_type: "derivative"
      measurement_uncertainties: "height_above_wgs84_ellipsoid_uncertainties"
